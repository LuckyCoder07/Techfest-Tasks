<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>DIVE — 3D Ocean Tunnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Sans:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{height:600vh;overflow-x:hidden;font-family:'DM Sans',system-ui,sans-serif;color:#fff;background:#020408}

/* Background canvas — procedural caustic-light field.
   Replaces the old flat CSS gradient div. Painted entirely in JS
   (see drawFrame()), so it can react to scroll position, scroll
   velocity, and live cursor position every animation frame. */
#bgCanvas{position:fixed;inset:0;z-index:-1;display:block}

/* Vignette darkens toward abyss */
#vgn{position:fixed;inset:0;z-index:50;pointer-events:none}

/* ─── 3D STACK ─── */
/* Perspective container — fixed, covers viewport */
#vp{position:fixed;inset:0;z-index:1;perspective:900px;perspective-origin:50% 50%;overflow:hidden}
/* Stage receives mouse-rotation */
#stg{position:absolute;inset:0;transform-style:preserve-3d}
/* World receives scroll-driven translateZ */
#wld{position:absolute;inset:0;transform-style:preserve-3d}

/* Every scene object is absolutely placed in this 3D space */
.el{position:absolute;transform-style:preserve-3d;will-change:transform,opacity}

/* ─── ANIMS ─── */
@keyframes jfl{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-18px) rotate(2deg)}}
@keyframes lure{from{filter:drop-shadow(0 0 5px rgba(0,255,155,.85))}to{filter:drop-shadow(0 0 22px rgba(0,255,155,1))}}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.32}50%{transform:translateY(7px);opacity:.7}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx,8px),var(--dy,-15px))}}
@keyframes rb{0%{transform:translateY(0) scale(1);opacity:.65}100%{transform:translateY(-150px) scale(1.1);opacity:0}}
@keyframes rp{from{opacity:var(--ro,.1)}to{opacity:calc(var(--ro,.1)*.42)}}

/* ─── HUD ─── */
#hud{position:fixed;inset:0;z-index:100;pointer-events:none}

#entry{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ht{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(7rem,20vw,16rem);font-weight:300;font-style:italic;line-height:1;letter-spacing:-.03em;color:rgba(255,255,255,.93);text-shadow:0 2px 60px rgba(0,160,220,.4)}
.hs{font-weight:300;font-size:clamp(.72rem,1.4vw,.88rem);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.44);margin-top:.9rem}
.sh{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.12em;color:rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:2.5rem;animation:bob 2.4s ease-in-out infinite}

/* Zone label bottom-centre */
#zl{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .7s ease}
.ze{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.34);margin-bottom:8px}
.zt{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.6rem,3.5vw,2.8rem);font-weight:300;font-style:italic;color:rgba(255,255,255,.88);line-height:1.1}
.zd{font-family:'Space Mono',monospace;font-size:.58rem;color:rgba(255,255,255,.24);margin-top:5px;letter-spacing:.1em}

/* Depth meter */
.dm{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
.dv{font-family:'Space Mono',monospace;font-size:8px;color:rgba(255,255,255,.55);white-space:nowrap}
.dt{width:1px;height:110px;background:rgba(255,255,255,.14);position:relative}
.df{position:absolute;top:0;left:0;width:100%;background:rgba(255,255,255,.7);height:0%}
.dd{position:absolute;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);top:0%}
.dl{font-family:'Space Mono',monospace;font-size:7px;color:rgba(255,255,255,.26);letter-spacing:.18em;writing-mode:vertical-lr;transform:rotate(180deg)}

/* Tilt hint */
#th{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.18em;color:rgba(255,255,255,.2);opacity:0;transition:opacity 1.2s ease;text-align:center}

/* ─── UNDERWATER DISTORTION FILTER ───────────────────────────
   Applied to #vp (the 3D scene container) via SVG feTurbulence +
   feDisplacementMap. JS animates both baseFrequency (idle ripple)
   and scale (scroll-velocity warp).

   TEXT PROTECTION: #hud is a sibling of #vp, not a descendant.
   CSS filters only affect the element they're set on and its
   subtree, so every HUD element — depth meter, zone labels,
   hero title — is completely outside this filter and stays
   pixel-perfect sharp at all distortion levels.               */
#vp{filter:url(#ocean-warp)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  #wld{transform:none!important}#stg{transform:none!important}
  .el{opacity:1!important}
  #vp{filter:none!important}
}
</style>

<body>

<!-- ═══ UNDERWATER DISTORTION FILTER DEFINITION ═══════════════
  This SVG is rendered at 0×0 — it only supplies the filter
  primitive graph that #vp references via  filter:url(#ocean-warp).

  feTurbulence  — Perlin noise source.
    • type="turbulence"  gives the sharp refractive look of
      light bending through choppy water (vs. fractalNoise which
      is smoother but less "watery").
    • baseFrequency is updated every RAF by JS:
        idle  → slow sine oscillation (0.010–0.018 × 0.006–0.012)
        scroll → higher values (up to ~0.045 × 0.029), creating
               smaller, choppier turbulence that reads as
               turbulent current vs. calm water.
    • numOctaves="3"  — two detail levels beyond the base wave;
      more = richer but more expensive.
    • seed="4"  — fixed pattern shape; only frequency/scale move.

  feDisplacementMap  — warps SourceGraphic using the noise map.
    • scale is the displacement amplitude in pixels:
        idle  ≈  12 px  (barely perceptible shimmer)
        light ≈  35 px  (clear gentle ripple)
        heavy ≈ 150 px  (full turbulent distortion)
    • R-channel → horizontal warp, G-channel → vertical warp.

  Filter region x/y/width/height extends 12 % beyond #vp bounds
  so that pixels displaced inward from edges don't leave black
  gaps at viewport margins.                                      -->
<svg id="fsvg" xmlns="http://www.w3.org/2000/svg"
     style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="ocean-warp"
            x="-12%" y="-12%" width="124%" height="124%"
            color-interpolation-filters="sRGB">
      <feTurbulence id="ft"
        type="turbulence"
        baseFrequency="0.013 0.009"
        numOctaves="3"
        seed="4"
        result="warpNoise"/>
      <feDisplacementMap id="fd"
        in="SourceGraphic"
        in2="warpNoise"
        scale="12"
        xChannelSelector="R"
        yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="hud">
  <div id="entry">

    <p class="hs">An exploration of the ocean's hidden depths</p>
    <div class="sh">

        <path d="M8 2v16M8 18L3 12M8 18l5-6" stroke="rgba(255,255,255,.38)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

<script>
const MAX_Z = 10000;
const $ = id => document.getElementById(id);
const wld = $('wld'), stg = $('stg'), vgn = $('vgn');
const entry = $('entry'), zl = $('zl'), th = $('th');

// ─── BACKGROUND CANVAS SETUP ─────────────────────────────────────
// A fixed full-viewport <canvas> replaces the old flat CSS gradient
// div. It's painted fresh every RAF frame inside drawFrame(), driven
// by the same `wz` (world-Z / scroll-depth) value that drives the
// 3D tunnel — so the two layers always stay perfectly synced.
const canvas = $('bgCanvas');
const gtx    = canvas.getContext('2d');
let dpr = 1, vw = innerWidth, vh = innerHeight;

function resizeCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.5); // cap for perf
  vw  = innerWidth;  vh = innerHeight;
  canvas.width  = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width  = vw + 'px';
  canvas.style.height = vh + 'px';
  // From here on we draw in CSS-pixel coordinates; this transform
  // bakes the device-pixel-ratio scale in once so fillRect(0,0,vw,vh)
  // always covers exactly the visible viewport at native sharpness.
  gtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Raw pixel cursor position (separate from the -1..1 normalised
// mTX/mTY used for the 3D tilt). This drives the canvas "torch".
let mPX = vw / 2, mPY = vh / 2;   // latest raw pointer position
let lPX = mPX,    lPY = mPY;      // smoothed / lagged light position

// Cache element z-values once
const els = [...document.querySelectorAll('.el')].map(e => ({ e, z: +e.dataset.z }));

// Mouse state
let mTX = 0, mTY = 0, mCX = 0, mCY = 0, mUsed = false;

// ─── DISTORTION FILTER STATE ────────────────────────────────────
// SVG filter primitive references — mutated every animation frame.
const ft = document.getElementById('ft'); // <feTurbulence>
const fd = document.getElementById('fd'); // <feDisplacementMap>

// Scroll-velocity tracking.
// dVelSmooth is an exponentially-weighted moving average of the
// absolute per-frame scroll delta (px/frame at 60 fps).
// This gives instant spike on scroll start and a satisfying slow
// return to zero when the user stops.
let dVelSmooth = 0;
let dLastY     = window.scrollY; // scrollY sampled the previous frame

// Displacement scale state — we chase dScaleTarget each frame
// with asymmetric easing (fast up, slow decay).
let dScale     = 12;   // current rendered scale (px)
let dScaleTarget = 12; // target scale driven by velocity

// Zone definitions
const zones = [
  { s:    0, end:2400, eye:'Surface',           ti:'Open water',          d:'0 m'              },
  { s: 2400, end:5100, eye:'The Sunlit Zone',    ti:'Light & Abundance',   d:'0 – 200 m'        },
  { s: 5100, end:7600, eye:'The Twilight Zone',  ti:'Where Light Fades',   d:'200 – 1,000 m'    },
  { s: 7600, end:10000,eye:'The Midnight Zone',  ti:'The Abyss',           d:'1,000 – 4,000 m+' },
];

// ─── CANVAS CAUSTIC BACKGROUND ───────────────────────────────────
//
// Three layers are composited every frame, back to front:
//   1. Base fill      — depth-interpolated flat colour (was the old
//                        CSS gradient; now painted per-pixel here).
//   2. Caustic shimmer — soft "lighter"-blended blobs that trace a
//                        Lissajous-style path. Their phase is a
//                        DETERMINISTIC function of wz (scroll depth)
//                        only — no independent real-time term — so
//                        scrolling backward retraces the exact same
//                        visual states in reverse. Scrolling deeper
//                        both increases the phase-per-pixel rate
//                        (patterns visibly speed up) and dims/shrinks
//                        the blobs (patterns visibly darken).
//   3. Magnetic torch  — a radial "lighter"-blended light centred on
//                        a lagged cursor position, independent of
//                        scroll — the one live, mouse-only layer.

// Base fill colour stops [worldZ, [r,g,b]] — unchanged palette from
// the original gradient, now sampled in JS per frame instead of CSS.
const bgS = [
  [0,    [192,232,248]],
  [1800, [42,149,200]],
  [3200, [8,112,160]],
  [5200, [6,72,112]],
  [7200, [2,28,56]],
  [10000,[2,4,8]],
];

// Caustic tint stops — shifts from bright sunlit white-cyan down to
// a dim bioluminescent green-teal in the abyss.
const causticS = [
  [0,    [255,255,255]],
  [1800, [190,240,255]],
  [3200, [120,222,255]],
  [5200, [55,205,225]],
  [7200, [35,235,185]],
  [10000,[15,165,130]],
];

function lerpStops(stops, wz) {
  for (let i = 0; i < stops.length - 1; i++) {
    const [az,ac] = stops[i], [bz,bc] = stops[i+1];
    if (wz >= az && wz <= bz) {
      const t = (wz-az)/(bz-az);
      return [
        Math.round(ac[0]+(bc[0]-ac[0])*t),
        Math.round(ac[1]+(bc[1]-ac[1])*t),
        Math.round(ac[2]+(bc[2]-ac[2])*t),
      ];
    }
  }
  return stops[stops.length-1][1];
}

function drawCaustics(wz, depthP, tint) {
  // Phase is purely a function of wz (+ a depth-scaled rate), so the
  // exact same scroll position always reproduces the exact same
  // pattern — reversing scroll direction reverses the animation
  // perfectly, with no drift or desync.
  const rate  = 0.9 + depthP * 3.4;      // deeper = faster-changing pattern
  const phase = wz * 0.0026 * rate;
  const [r,g,b] = tint;

  gtx.globalCompositeOperation = 'lighter';
  const n = 5;
  for (let i = 0; i < n; i++) {
    const t  = phase + i * 1.7;
    const x  = (0.5 + 0.38*Math.sin(t*0.72 + i*1.1))  * vw;
    const y  = (0.5 + 0.34*Math.cos(t*0.51 + i*1.9))  * vh;
    const rad = (0.24 + 0.09*Math.sin(t*1.05 + i))    * Math.max(vw,vh) * (1 - depthP*0.35);
    const op  = (0.11 + 0.05*Math.sin(t*0.88 + i*2.2))* (1 - depthP*0.6); // dims with depth
    const grd = gtx.createRadialGradient(x,y,0,x,y,Math.max(rad,1));
    grd.addColorStop(0, `rgba(${r},${g},${b},${Math.max(op,0).toFixed(3)})`);
    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
    gtx.fillStyle = grd;
    gtx.fillRect(0,0,vw,vh);
  }
  gtx.globalCompositeOperation = 'source-over';
}

function drawTorch(x, y, depthP) {
  // The magnetic cursor light — brighter and slightly wider in the
  // dark abyss (like a torch cutting through deep water), subtler
  // near the sunlit surface where ambient light already does the work.
  const rad = 230 + depthP*110;
  const op  = 0.05 + depthP*0.22;
  const grd = gtx.createRadialGradient(x,y,0,x,y,rad);
  grd.addColorStop(0,   `rgba(255,255,255,${op.toFixed(3)})`);
  grd.addColorStop(0.45,`rgba(205,238,255,${(op*0.45).toFixed(3)})`);
  grd.addColorStop(1,   'rgba(205,238,255,0)');
  gtx.globalCompositeOperation = 'lighter';
  gtx.fillStyle = grd;
  gtx.fillRect(0,0,vw,vh);
  gtx.globalCompositeOperation = 'source-over';
}

function drawFrame(wz) {
  const depthP = Math.min(wz / MAX_Z, 1);

  gtx.fillStyle = `rgb(${lerpStops(bgS, wz).join(',')})`;
  gtx.fillRect(0, 0, vw, vh);

  drawCaustics(wz, depthP, lerpStops(causticS, wz));
  drawTorch(lPX, lPY, depthP);
}

window.addEventListener('mousemove', e => {
  mTX = (e.clientX/innerWidth  - .5)*2;
  mTY = (e.clientY/innerHeight - .5)*2;
  mPX = e.clientX;   // raw pixel position for the canvas light source
  mPY = e.clientY;
  if (!mUsed) { mUsed = true; th.style.opacity = '0'; }
}, {passive:true});

let lastZone = null;

function tick() {
  const maxS = document.documentElement.scrollHeight - innerHeight;
  const wz   = (scrollY / Math.max(maxS,1)) * MAX_Z;

  // Smooth mouse lerp (3D tilt)
  mCX += (mTX-mCX)*.07;
  mCY += (mTY-mCY)*.07;

  // Smooth torch-light lag — snappier than the tilt (.15 vs .07) so
  // the "magnetic" light feels responsive while still trailing the
  // raw cursor with a touch of physical weight.
  lPX += (mPX-lPX)*.15;
  lPY += (mPY-lPY)*.15;

  // 3D transforms
  // Stage: mouse-follow rotation gives the "whole ocean tilts" feel
  stg.style.transform = `rotateX(${(-mCY*3.5).toFixed(3)}deg) rotateY(${(mCX*5.5).toFixed(3)}deg)`;
  // World: scroll drives Z-axis flight — you are physically flying forward
  wld.style.transform  = `translateZ(${wz.toFixed(1)}px)`;

  // Background canvas: base colour + scroll-scrubbed caustics + torch
  drawFrame(wz);

  // Vignette: grows darker as you descend
  const vp = Math.min(wz/7500, 1);
  vgn.style.background = `radial-gradient(ellipse 68% 68% at 50% 50%,transparent 22%,rgba(0,0,0,${(vp*.62).toFixed(3)}) 100%)`;

  // Per-element opacity based on effective Z (distance to camera)
  // effectiveZ = el.baseZ + worldZ
  //   negative = still ahead of camera (visible)
  //   zero     = at camera
  //   positive = behind camera (clip/fade)
  for (const {e,z} of els) {
    const eff = z + wz;
    let op = 1;
    // Far: fade in as element emerges from distance
    if (eff < -4500) op = Math.max(0, 1-(-eff-4500)/2200);
    // Near: scale up then fade out before passing camera
    if (eff > -300)  op = Math.min(op, Math.max(0, (-eff-25)/275));
    // Behind: fully invisible
    if (eff > 0)     op = 0;
    e.style.opacity = op <= 0 ? '0' : op >= 1 ? '' : op.toFixed(3);
  }

  // Depth meter
  const p  = Math.min(wz/MAX_Z, 1);
  const dm = Math.round(p*4000);
  $('df').style.height = (p*100)+'%';
  $('dd').style.top    = (p*100)+'%';
  $('dv').textContent  = dm < 5 ? 'Surface' : dm+'m';

  // Entry screen (hero)
  const ef = Math.max(0, 1-wz/750);
  entry.style.opacity = ef;
  entry.style.pointerEvents = ef < .05 ? 'none' : '';

  // Tilt hint (appears briefly mid-surface, disappears on mouse move)
  if (!mUsed && wz > 200 && wz < 1800) th.style.opacity = '1';

  // Zone label
  const zone = zones.find(z => wz >= z.s && wz < z.end);
  if (zone && wz > 500) {
    const t  = (wz - zone.s)/(zone.end - zone.s);
    const lop = t < .12 ? t/.12 : t > .84 ? (1-t)/.16 : 1;
    if (zone !== lastZone) {
      $('ze').textContent = zone.eye;
      $('zt').textContent = zone.ti;
      $('zd').textContent = zone.d;
      lastZone = zone;
    }
    zl.style.opacity = lop.toFixed(3);
  } else {
    zl.style.opacity = '0';
  }

  // ─── UNDERWATER DISTORTION UPDATE ────────────────────────────
  // Called once per animation frame inside tick() so distortion
  // and all other scene updates stay perfectly in sync.

  const now = performance.now() / 1000; // seconds since page load

  // ① Measure per-frame scroll velocity.
  //    We diff scrollY between frames rather than using a scroll
  //    event because scroll events are async and can batch; reading
  //    scrollY here gives us the true per-frame delta.
  const frameDelta = Math.abs(window.scrollY - dLastY);
  dLastY = window.scrollY;

  // ② Exponential smoothing.
  //    α=0.12 weights the new delta lightly → spike is absorbed
  //    quickly but the tail decays slowly (factor 0.88 per frame).
  //    At 60 fps, dVelSmooth halves roughly every 5–6 frames after
  //    scrolling stops, giving a ~0.5 s perceptible tail.
  dVelSmooth = dVelSmooth * 0.88 + frameDelta * 0.12;

  // ③ Map smoothed velocity → target displacement scale.
  //    idle (vel ≈ 0)   →  scale ≈  12 px  (barely perceptible shimmer)
  //    gentle (vel ≈ 8) →  scale ≈  38 px  (clear ripple ring)
  //    fast   (vel ≈ 45)→  scale ≈ 150 px  (heavy turbulent warp)
  dScaleTarget = 12 + Math.min(dVelSmooth * 3.2, 138);

  // ④ Asymmetric easing toward target.
  //    Rising  (scroll starts): 28 % per frame → near-instant response.
  //    Falling (scroll stops) :  3 % per frame → smooth ~2 s tail-off.
  //    This makes the warp feel reactive on input yet elegant at rest.
  const chaseRate = dScaleTarget > dScale ? 0.28 : 0.032;
  dScale += (dScaleTarget - dScale) * chaseRate;

  // ⑤ Velocity factor 0→1 — also drives baseFrequency character.
  //    Higher velocity = higher frequency = choppier, smaller
  //    turbulence cells that read as fast current rather than calm swell.
  const vf = Math.min(dVelSmooth / 45, 1);

  // ⑥ Animate baseFrequency for the idle ripple.
  //    Two out-of-phase sine waves on X and Y axes create a
  //    constantly-shifting noise map that reads as drifting water
  //    caustics even when the user isn't scrolling.
  //    Scroll velocity adds to the base frequency, compressing
  //    the pattern into the fine-grained turbulence of disturbed water.
  const bfx = (0.013 + Math.sin(now * 0.38) * 0.005) + vf * 0.034;
  const bfy = (0.009 + Math.cos(now * 0.27) * 0.003) + vf * 0.022;

  ft.setAttribute('baseFrequency', `${bfx.toFixed(5)} ${bfy.toFixed(5)}`);
  fd.setAttribute('scale',          dScale.toFixed(2));
  // ──────────────────────────────────────────────────────────────

  requestAnimationFrame(tick);
}

// Bubble spawner
function spawnBub(id, n) {
  const c = $(id); if (!c) return;
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div'), s = Math.random()*14+4;
    b.style.cssText = `position:absolute;width:${s}px;height:${s}px;border-radius:50%;`+
      `border:1px solid rgba(255,255,255,${.14+Math.random()*.24});`+
      `background:rgba(255,255,255,${.02+Math.random()*.04});`+
      `left:${Math.random()*100}%;top:${Math.random()*100}%;`+
      `animation:rb ${3+Math.random()*5}s ease-in ${-Math.random()*8}s infinite;`;
    c.appendChild(b);
  }
}

// Bioluminescent particle spawner
function spawnPts(id, n, r, g, b) {
  const c = $(id); if (!c) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'), s = Math.random()*2.8+.5, op = Math.random()*.45+.1;
    p.style.cssText = `position:absolute;width:${s}px;height:${s}px;border-radius:50%;`+
      `background:rgba(${r},${g},${b},${op});box-shadow:0 0 ${s*3}px rgba(${r},${g},${b},.42);`+
      `left:${Math.random()*100}%;top:${Math.random()*100}%;`+
      `--dx:${(Math.random()-.5)*80}px;--dy:${(Math.random()-.5)*80}px;`+
      `animation:drift ${5+Math.random()*10}s ease-in-out ${-Math.random()*14}s infinite alternate;`;
    c.appendChild(p);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  spawnBub('b1',9); spawnBub('b2',7); spawnBub('b3',8);
  spawnPts('tw-a',36,0,210,255); spawnPts('tw-b',30,0,190,255); spawnPts('tw-c',28,80,150,255);
  spawnPts('ab-a',52,0,245,155); spawnPts('ab-b',46,0,220,130); spawnPts('ab-c',58,0,255,175);
  requestAnimationFrame(tick);
});
